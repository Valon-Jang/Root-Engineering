name: SH007 Extract

on:
  push:
    branches:
      - tmp/sh007-final-extract
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Locate source through Piped
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          ID='9livmGRegBk'
          INSTANCES=(
            'https://pipedapi.adminforge.de'
            'https://api.piped.private.coffee'
            'https://pipedapi.us.projectsegfau.lt'
            'https://pipedapi.palveluntarjoaja.eu'
            'https://pipedapi.smnz.de'
            'https://pipedapi.qdi.fi'
          )
          ok=''
          for base in "${INSTANCES[@]}"; do
            echo "TRY=$base"
            if curl -A 'Mozilla/5.0' --connect-timeout 8 --max-time 25 -fsSL "$base/streams/$ID" -o out/streams.json \
              && jq -e '.videoStreams | length > 0' out/streams.json >/dev/null 2>&1; then
              ok="$base"
              break
            fi
          done
          if [ -z "$ok" ]; then
            echo 'NO_PIPED_INSTANCE_SUCCEEDED'
            exit 1
          fi
          printf '%s\n' "$ok" > out/instance.txt
          jq '{title,uploader,duration,uploadDate,livestream,subtitles,videoStreams:[.videoStreams[]|{url,format,quality,mimeType,codec,width,height,fps,videoOnly,bitrate}],audioStreams:[.audioStreams[]|{url,format,quality,mimeType,codec,bitrate}]}' out/streams.json > out/streams_compact.json
          jq -r '"TITLE="+.title,"UPLOADER="+.uploader,"DURATION="+(.duration|tostring)' out/streams.json
          SUB=$(jq -r '[.subtitles[]? | select((.code // "") | startswith("en"))][0].url // empty' out/streams.json)
          if [ -n "$SUB" ]; then
            curl -A 'Mozilla/5.0' --connect-timeout 8 --max-time 30 -fsSL "$SUB" -o out/subtitles.vtt || true
          fi
          echo '--- KEYWORD HITS ---'
          if [ -s out/subtitles.vtt ]; then
            grep -i -n -C 12 -E 'nurovi|spot.?scrub|ultraviolet|\buv\b|stain|robot vacuum|floor cleaning robot' out/subtitles.vtt || true
          else
            echo 'NO_ENGLISH_SUBTITLE'
          fi
          ls -lah out
      - name: Upload locate files
        uses: actions/upload-artifact@v4
        with:
          name: sh007-locate-piped
          path: out/
          if-no-files-found: error
          retention-days: 1
