name: SH007 Extract

on:
  push:
    branches:
      - tmp/sh007-final-extract
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - name: Scan Dyson official page media
        run: node tmp/sh007/scan-dyson.mjs
      - name: Summarize candidates
        shell: bash
        run: |
          echo '--- MEDIA ---'
          cat out/media.json
          echo '--- DOM VIDEO ---'
          cat out/dom.json
          echo '--- R3 HTML MEDIA LINES ---'
          grep -Eio '.{0,160}(mp4|m3u8|mpd|video|brightcove|src=).{0,260}' out/r3.html | head -200 || true
      - name: Upload scan files
        uses: actions/upload-artifact@v4
        with:
          name: sh007-dyson-page-scan
          path: out/
          if-no-files-found: error
          retention-days: 1
