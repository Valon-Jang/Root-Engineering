name: SH007 Extract

on:
  push:
    branches:
      - tmp/sh007-final-extract
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - name: Scan TechRadar article media
        run: node tmp/sh007/scan-techradar.mjs
      - name: Show media candidates
        shell: bash
        run: |
          cat out/media.json
          echo '--- DOM ---'
          cat out/dom.json
      - name: Upload scan
        uses: actions/upload-artifact@v4
        with:
          name: sh007-techradar-scan
          path: out/
          if-no-files-found: error
          retention-days: 1
