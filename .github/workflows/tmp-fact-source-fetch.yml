name: Temporary FACT Source Inspect

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fact-source-fetch.yml

permissions:
  contents: read

jobs:
  save-source-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public source pages
        run: |
          mkdir -p out
          curl -L --fail "https://www.freightwaves.com/news/how-its-delivered-wing-gives-glimpse-of-a-future-with-drone-delivery" -o out/freightwaves.html
          curl -L --fail "https://wing.com/news/how-do-you-get-package-from-drone-to" -o out/wing_delivery.html
      - name: Upload source html
        uses: actions/upload-artifact@v4
        with:
          name: wing_source_html
          path: out/
          retention-days: 1
