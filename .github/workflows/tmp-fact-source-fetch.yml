name: Temporary FACT Source Fetch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fact-source-fetch.yml

permissions:
  contents: read

jobs:
  fetch-residential-proof-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public evidence image
        run: |
          mkdir -p out
          curl -L --fail "https://www.drones.gov.au/sites/default/files/images/Wing%20Delivery%205.jpg" -o out/F01B_Wing_residential_delivery.jpg
      - name: Upload evidence image
        uses: actions/upload-artifact@v4
        with:
          name: wing_residential_delivery_image
          path: out/
          retention-days: 1
