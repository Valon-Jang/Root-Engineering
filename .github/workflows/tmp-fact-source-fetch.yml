name: Temporary FACT Source Fetch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-fact-source-fetch.yml

permissions:
  contents: read

jobs:
  fetch-wing-delivery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install media tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q --break-system-packages yt-dlp

      - name: Download and probe Wing delivery proof video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://www.youtube.com/watch?v=snLOdFxrvUo'
          yt-dlp --no-playlist -f 'bv*+ba/b' --merge-output-format mp4 -o 'out/F01_Wing_ground_delivery_MASTER.%(ext)s' "$URL"
          MASTER=$(find out -maxdepth 1 -type f -name 'F01_Wing_ground_delivery_MASTER.*' | head -n1)
          ffprobe -v quiet -print_format json -show_format -show_streams "$MASTER" > out/F01_Wing_ground_delivery_METADATA.json
          ffmpeg -y -i "$MASTER" -vf "scale=960:-2" -c:v libx264 -preset veryfast -crf 24 -an out/F01_Wing_ground_delivery_PROXY.mp4
          ffmpeg -y -i "$MASTER" -vf "fps=1,scale=320:-2,drawtext=text='%{pts\\:hms}':x=8:y=8:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.55,tile=5x12:padding=4:margin=4" -frames:v 1 -q:v 2 out/F01_Wing_ground_delivery_CONTACT.jpg
          ls -lh out

      - name: Upload FACT source pack probe
        uses: actions/upload-artifact@v4
        with:
          name: F01_Wing_ground_delivery_probe
          path: out/
          if-no-files-found: error
          retention-days: 1
