name: Persistent Web Session Carrier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .bridge/carrier/bootstrap.txt
  repository_dispatch:
    types: [persistent-web-session-handoff]

permissions:
  contents: write
  actions: write

jobs:
  naver-carrier:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: Valon-Jang/Root-Engineering/.github/workflows/naver-carrier-worker.yml@naver-persistent-carrier-20260830
    with:
      carrier_ref: naver-persistent-carrier-20260830
      mode: ${{ github.event_name == 'repository_dispatch' && 'handoff' || 'bootstrap' }}
      generation: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.generation || format('bootstrap-{0}', github.run_id) }}
      predecessor_run_id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.predecessor_run_id || '' }}
    secrets: inherit
