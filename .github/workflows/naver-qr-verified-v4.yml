name: Naver QR Verified Bridge v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/naver-qr-verified-v4.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc openbox novnc websockify python3-pip
          python3 -m pip install --quiet --break-system-packages selenium
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start browser, open QR tab, verify screenshot, and tunnel
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export HOME=/tmp/naver-v4/home
          mkdir -p "$HOME" /tmp/naver-v4/profile /tmp/naver-v4/out

          VNC_PASSWORD="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 24)"
          printf '%s' "$VNC_PASSWORD" >/tmp/naver-v4/vnc-password.txt
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/naver-v4/vnc.pass >/dev/null

          nohup Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/naver-v4/xvfb.log 2>&1 &
          sleep 2
          nohup openbox >/tmp/naver-v4/openbox.log 2>&1 &
          nohup "$CHROME_BINARY" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/naver-v4/profile \
            --window-position=0,0 --window-size=1440,900 \
            'https://nid.naver.com/nidlogin.login' \
            >/tmp/naver-v4/chrome.log 2>&1 &

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          python3 - <<'PY'
          import json, os, re, time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By

          opt = webdriver.ChromeOptions()
          opt.debugger_address = '127.0.0.1:9222'
          driver = webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']), options=opt)
          state = {'clicked_qr': False, 'current_url': driver.current_url, 'visible_qr_candidates': []}
          try:
              time.sleep(4)
              clickables = driver.find_elements(By.XPATH, "//*[self::a or self::button or @role='button' or @role='tab']")
              for el in clickables:
                  try:
                      if not el.is_displayed():
                          continue
                      txt = (el.text or el.get_attribute('aria-label') or el.get_attribute('title') or '').strip()
                      if re.search(r'QR\s*(코드|로그인)?', txt, re.I):
                          el.click()
                          state['clicked_qr'] = True
                          state['clicked_text'] = txt
                          break
                  except Exception:
                      pass
              if not state['clicked_qr']:
                  driver.get('https://nid.naver.com/nidlogin.login?mode=qrcode')
              time.sleep(5)
              state['current_url'] = driver.current_url
              body_text = driver.find_element(By.TAG_NAME, 'body').text
              state['body_excerpt'] = body_text[:2000]
              candidates = []
              for sel in ["img", "canvas", "svg", "[class*='qr' i]", "[id*='qr' i]"]:
                  try:
                      for e in driver.find_elements(By.CSS_SELECTOR, sel):
                          if e.is_displayed() and e.size.get('width',0) >= 80 and e.size.get('height',0) >= 80:
                              candidates.append({'selector': sel, 'tag': e.tag_name, 'size': e.size})
                  except Exception:
                      pass
              state['visible_qr_candidates'] = candidates[:20]
              state['text_mentions_qr'] = bool(re.search(r'QR', body_text, re.I))
              driver.save_screenshot('/tmp/naver-v4/out/page.png')
              with open('/tmp/naver-v4/out/page-state.json','w',encoding='utf-8') as f:
                  json.dump(state,f,ensure_ascii=False,indent=2)
          finally:
              driver.quit()
          PY

          nohup x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/naver-v4/vnc.pass -forever -shared -noxdamage >/tmp/naver-v4/x11vnc.log 2>&1 &
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/naver-v4/websockify.log 2>&1 &
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/naver-v4/cloudflared.log 2>&1 &

          LIVE_BASE=''
          for _ in $(seq 1 90); do
            LIVE_BASE="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/naver-v4/cloudflared.log | head -n1 || true)"
            [ -n "$LIVE_BASE" ] && break
            sleep 1
          done
          test -n "$LIVE_BASE"
          printf '%s/vnc.html?autoconnect=1&resize=scale&view_only=0' "$LIVE_BASE" >/tmp/naver-v4/out/live-url.txt
          cp /tmp/naver-v4/vnc-password.txt /tmp/naver-v4/out/vnc-password.txt

      - name: Upload verified QR bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-qr-bundle
          path: /tmp/naver-v4/out
          retention-days: 1
          if-no-files-found: error

      - name: Keep the verified browser alive
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 1800); do
            pgrep -f 'cloudflared tunnel' >/dev/null || exit 1
            pgrep -f 'websockify.*6080' >/dev/null || exit 1
            pgrep -f 'remote-debugging-port=9222' >/dev/null || exit 1
            sleep 1
          done
