name: Repair Claude package connectivity

on:
  push:
    branches: [main]
    paths:
      - tools/repair_claude_package_connectivity.py
      - .github/workflows/repair-claude-package-connectivity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair package and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/repair_claude_package_connectivity.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('s = CURRENT.read_text(encoding="utf-8")ns_old =', 's = CURRENT.read_text(encoding="utf-8")\nns_old =')
          p.write_text(s, encoding='utf-8')
          PY
          python tools/repair_claude_package_connectivity.py
          python tools/validate_claude_installer.py
          git diff --check
      - name: Publish repair
        shell: bash
        run: |
          rm -f tools/repair_claude_package_connectivity.py
          rm -f .github/workflows/repair-claude-package-connectivity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Claude installer package connectivity"
          git push
