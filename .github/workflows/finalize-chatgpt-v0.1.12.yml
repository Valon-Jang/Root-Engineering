name: Finalize ChatGPT Root Engineering v0.1.12

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-chatgpt-v0.1.12.yml
      - tools/finalize_chatgpt_v0_1_12.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        run: python tools/finalize_chatgpt_v0_1_12.py
      - name: Commit final package
        shell: bash
        run: |
          rm -f .github/workflows/finalize-chatgpt-v0.1.12.yml
          rm -f tools/finalize_chatgpt_v0_1_12.py
          rm -f tools/upgrade_chatgpt_root_engineering_v0_1_12.py
          rm -f tools/upgrade_chatgpt_root_engineering_v0_1_12_failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize ChatGPT Root Engineering v0.1.12"
          git push
