name: One-time VNC Controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/one-time-vnc-controller.yml
      - .bridge/controller-start.txt

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out controller branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium cryptography requests

      - name: Generate one-time controller key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vnc-controller
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/vnc-controller/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/vnc-controller/private.pem -pubout -out /tmp/vnc-controller/public.pem >/dev/null 2>&1

      - name: Upload controller public key
        uses: actions/upload-artifact@v4
        with:
          name: controller-public-key
          path: /tmp/vnc-controller/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for and decrypt request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, pathlib, time, requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          out = pathlib.Path('/tmp/vnc-controller')
          request_id = pathlib.Path('.bridge/controller-start.txt').read_text(encoding='utf-8').strip()
          repository = os.environ['REPOSITORY']
          branch = os.environ.get('HEAD_REF') or 'web-login-bridge-20260829'
          url = f'https://api.github.com/repos/{repository}/contents/.bridge/controller-request.enc'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          private_key = serialization.load_pem_private_key((out/'private.pem').read_bytes(), password=None)

          def decrypt(raw):
              env = json.loads(raw.decode('utf-8'))
              aes_key = private_key.decrypt(
                  base64.b64decode(env['wrapped_key']),
                  padding.OAEP(
                      mgf=padding.MGF1(algorithm=hashes.SHA256()),
                      algorithm=hashes.SHA256(),
                      label=None,
                  ),
              )
              return json.loads(
                  AESGCM(aes_key).decrypt(
                      base64.b64decode(env['nonce']),
                      base64.b64decode(env['ciphertext']),
                      None,
                  ).decode('utf-8')
              )

          deadline = time.time() + 180
          last = 'request not seen'
          while time.time() < deadline:
              r = requests.get(url, headers=headers, params={'ref': branch}, timeout=20)
              if r.status_code == 200:
                  try:
                      raw = base64.b64decode(r.json()['content'])
                      cmd = decrypt(raw)
                      if cmd.get('request_id') == request_id:
                          (out/'command.json').write_text(json.dumps(cmd), encoding='utf-8')
                          (out/'request-received.txt').write_text(request_id + '\n', encoding='utf-8')
                          print(f'Received encrypted request {request_id}')
                          break
                      last = f"request id mismatch: {cmd.get('request_id')}"
                  except Exception as exc:
                      last = f'decrypt pending: {type(exc).__name__}'
              else:
                  last = f'contents API status {r.status_code}'
              time.sleep(3)
          else:
              raise TimeoutError(last)
          PY

      - name: Upload request-received marker
        uses: actions/upload-artifact@v4
        with:
          name: request-received
          path: /tmp/vnc-controller/request-received.txt
          retention-days: 1
          if-no-files-found: error

      - name: Control live noVNC browser
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time, traceback
          from selenium import webdriver
          from selenium.webdriver import ActionChains
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          out = pathlib.Path('/tmp/vnc-controller')
          result = out/'result.json'
          screen = out/'screen.png'
          cmd = json.loads((out/'command.json').read_text(encoding='utf-8'))

          KEY_MAP = {
              'ENTER': Keys.ENTER, 'TAB': Keys.TAB, 'ESC': Keys.ESCAPE,
              'BACKSPACE': Keys.BACKSPACE, 'DELETE': Keys.DELETE, 'SPACE': Keys.SPACE,
              'UP': Keys.ARROW_UP, 'DOWN': Keys.ARROW_DOWN,
              'LEFT': Keys.ARROW_LEFT, 'RIGHT': Keys.ARROW_RIGHT,
              'HOME': Keys.HOME, 'END': Keys.END,
              'CTRL': Keys.CONTROL, 'CONTROL': Keys.CONTROL,
              'SHIFT': Keys.SHIFT, 'ALT': Keys.ALT, 'META': Keys.META,
          }
          def kval(v): return KEY_MAP.get(str(v).upper(), v)

          options = webdriver.ChromeOptions()
          binary = os.environ.get('CHROME_BINARY')
          if binary:
              options.binary_location = binary
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1600,1000')
          options.add_argument('--hide-scrollbars')
          service = Service(os.environ['CHROMEDRIVER']) if os.environ.get('CHROMEDRIVER') else Service()
          driver = webdriver.Chrome(service=service, options=options)

          try:
              driver.get(cmd['live_url'])
              end = time.time() + 30
              while time.time() < end:
                  fields = [e for e in driver.find_elements(By.CSS_SELECTOR, "input[type='password']") if e.is_displayed()]
                  if fields:
                      f = fields[0]
                      f.clear()
                      f.send_keys(cmd['vnc_password'])
                      clicked = driver.execute_script("""
                        const ids=['noVNC_password_button','noVNC_connect_button'];
                        for (const id of ids) {
                          const b=document.getElementById(id);
                          if (b && b.offsetParent!==null) { b.click(); return true; }
                        }
                        const bs=[...document.querySelectorAll('button,input[type=button],input[type=submit]')];
                        const b=bs.find(x => x.offsetParent!==null && /credential|connect|확인/i.test(x.innerText||x.value||''));
                        if (b) { b.click(); return true; }
                        return false;
                      """)
                      if not clicked:
                          f.send_keys(Keys.ENTER)
                      break
                  time.sleep(.5)

              def canvas_ready(d):
                  try:
                      c=d.find_element(By.ID,'noVNC_canvas')
                      s=c.size
                      return c if c.is_displayed() and s['width']>100 and s['height']>100 else False
                  except Exception:
                      return False

              canvas = WebDriverWait(driver, 30).until(canvas_ready)
              time.sleep(4)

              def hotkey(keys):
                  vals=[kval(k) for k in keys]
                  chain=ActionChains(driver).move_to_element(canvas).click()
                  for k in vals[:-1]: chain.key_down(k)
                  chain.send_keys(vals[-1])
                  for k in reversed(vals[:-1]): chain.key_up(k)
                  chain.perform()

              for a in cmd.get('actions', [{'type':'screenshot'}]):
                  t=a['type']
                  if t=='wait':
                      time.sleep(float(a.get('seconds',1)))
                  elif t=='click':
                      ActionChains(driver).move_to_element_with_offset(canvas,int(a['x']),int(a['y'])).click().perform()
                  elif t=='double_click':
                      ActionChains(driver).move_to_element_with_offset(canvas,int(a['x']),int(a['y'])).double_click().perform()
                  elif t=='text':
                      ActionChains(driver).move_to_element(canvas).click().send_keys(a['value']).perform()
                  elif t=='key':
                      ActionChains(driver).move_to_element(canvas).click().send_keys(kval(a['value'])).perform()
                  elif t=='hotkey':
                      hotkey(a['keys'])
                  elif t=='paste':
                      ok=driver.execute_script("""
                        if (window.UI && UI.rfb && UI.rfb.clipboardPasteFrom) {
                          UI.rfb.clipboardPasteFrom(arguments[0]); return true;
                        }
                        return false;
                      """, a['value'])
                      if not ok: raise RuntimeError('noVNC clipboard API unavailable')
                      time.sleep(.5)
                      hotkey(['CTRL','V'])
                  elif t=='screenshot':
                      driver.save_screenshot(str(screen))
                  else:
                      raise ValueError(f'unknown action {t}')
                  time.sleep(float(a.get('after',.5)))

              if not screen.exists():
                  driver.save_screenshot(str(screen))
              result.write_text(json.dumps({
                  'ok': True,
                  'request_id': cmd['request_id'],
                  'canvas_size': canvas.size,
                  'current_url': driver.current_url,
              }, indent=2), encoding='utf-8')
          except Exception as exc:
              try: driver.save_screenshot(str(screen))
              except Exception: pass
              result.write_text(json.dumps({
                  'ok': False,
                  'request_id': cmd.get('request_id'),
                  'error': f'{type(exc).__name__}: {exc}',
                  'traceback': traceback.format_exc(),
              }, indent=2), encoding='utf-8')
              raise
          finally:
              driver.quit()
          PY

      - name: Upload controller response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-response
          path: |
            /tmp/vnc-controller/result.json
            /tmp/vnc-controller/screen.png
          retention-days: 1
          if-no-files-found: warn
