name: Naver Single Bridge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/naver-single-bridge.yml
      - .bridge/single-command.json

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc openbox novnc websockify python3-venv
          python3 -m venv /tmp/naver-single-venv
          /tmp/naver-single-venv/bin/pip install --quiet selenium requests
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Start one browser, verify QR, and expose takeover
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export HOME=/tmp/naver-single/home
          mkdir -p "$HOME" /tmp/naver-single/profile /tmp/naver-single/out

          VNC_PASSWORD="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 24)"
          printf '%s' "$VNC_PASSWORD" >/tmp/naver-single/out/vnc-password.txt
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/naver-single/vnc.pass >/dev/null

          nohup Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/naver-single/xvfb.log 2>&1 &
          sleep 2
          nohup openbox >/tmp/naver-single/openbox.log 2>&1 &
          nohup "$CHROME_BINARY" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/naver-single/profile \
            --window-position=0,0 --window-size=1440,900 \
            'https://nid.naver.com/nidlogin.login' \
            >/tmp/naver-single/chrome.log 2>&1 &

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          /tmp/naver-single-venv/bin/python - <<'PY'
          import json, os, re, time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By

          opt = webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          driver = webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']), options=opt)
          state={'clicked_qr':False,'current_url':driver.current_url}
          try:
              time.sleep(4)
              for el in driver.find_elements(By.XPATH, "//*[self::a or self::button or @role='button' or @role='tab']"):
                  try:
                      if not el.is_displayed(): continue
                      txt=(el.text or el.get_attribute('aria-label') or el.get_attribute('title') or '').strip()
                      if re.search(r'QR\s*(코드|로그인)?',txt,re.I):
                          el.click(); state['clicked_qr']=True; state['clicked_text']=txt; break
                  except Exception: pass
              if not state['clicked_qr']:
                  driver.get('https://nid.naver.com/nidlogin.login?mode=qrcode')
              time.sleep(5)
              state['current_url']=driver.current_url
              body=driver.find_element(By.TAG_NAME,'body').text
              state['body_excerpt']=body[:1800]
              state['text_mentions_qr']=bool(re.search(r'QR',body,re.I))
              cands=[]
              for sel in ["img","canvas","svg","[class*='qr' i]","[id*='qr' i]"]:
                  try:
                      for e in driver.find_elements(By.CSS_SELECTOR,sel):
                          if e.is_displayed() and e.size.get('width',0)>=80 and e.size.get('height',0)>=80:
                              cands.append({'selector':sel,'tag':e.tag_name,'size':e.size})
                  except Exception: pass
              state['visible_qr_candidates']=cands[:20]
              driver.save_screenshot('/tmp/naver-single/out/page.png')
              with open('/tmp/naver-single/out/page-state.json','w',encoding='utf-8') as f:
                  json.dump(state,f,ensure_ascii=False,indent=2)
              if not state['text_mentions_qr'] and not cands:
                  raise RuntimeError('Rendered page does not appear to contain QR login')
          finally:
              driver.quit()
          PY

          nohup x11vnc -display :99 -rfbport 5900 -rfbauth /tmp/naver-single/vnc.pass -forever -shared -noxdamage >/tmp/naver-single/x11vnc.log 2>&1 &
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 >/tmp/naver-single/websockify.log 2>&1 &
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 >/tmp/naver-single/cloudflared.log 2>&1 &

          LIVE_BASE=''
          for _ in $(seq 1 90); do
            LIVE_BASE="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/naver-single/cloudflared.log | head -n1 || true)"
            [ -n "$LIVE_BASE" ] && break
            sleep 1
          done
          test -n "$LIVE_BASE"
          printf '%s/vnc.html?autoconnect=1&resize=scale&view_only=0' "$LIVE_BASE" >/tmp/naver-single/out/live-url.txt

      - name: Upload verified takeover bundle
        uses: actions/upload-artifact@v4
        with:
          name: naver-single-access
          path: /tmp/naver-single/out
          retention-days: 1
          if-no-files-found: error

      - name: Wait for command and send from same Chrome
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/naver-single-venv/bin/python - <<'PY'
          import base64, json, os, pathlib, re, time, traceback, requests
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          nonce='8bf79d2d2f9e41a7'
          repo=os.environ['REPOSITORY']; branch=os.environ['HEAD_REF']
          url=f'https://api.github.com/repos/{repo}/contents/.bridge/single-command.json'
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          deadline=time.time()+1800
          cmd=None
          while time.time()<deadline:
              r=requests.get(url,headers=headers,params={'ref':branch},timeout=20)
              if r.status_code==200:
                  raw=base64.b64decode(r.json()['content']).decode('utf-8')
                  try:
                      candidate=json.loads(raw)
                      if candidate.get('nonce')==nonce and candidate.get('state')=='execute':
                          cmd=candidate; break
                  except Exception: pass
              time.sleep(3)
          if not cmd: raise TimeoutError('No execute command received')

          out=pathlib.Path('/tmp/naver-single/out')
          opt=webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          driver=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          result={'ok':False,'to':cmd.get('to')}
          try:
              driver.get('https://mail.naver.com/v2/new')
              WebDriverWait(driver,30).until(lambda d:d.execute_script('return document.readyState') in ('interactive','complete'))
              time.sleep(6)
              if 'nidlogin' in driver.current_url.lower() or 'login' in driver.current_url.lower():
                  raise RuntimeError('Naver login session not authenticated')

              def visible_css(selectors):
                  for sel in selectors:
                      try:
                          es=[e for e in driver.find_elements(By.CSS_SELECTOR,sel) if e.is_displayed() and e.size.get('width',0)>2 and e.size.get('height',0)>2]
                          if es: return es[0],sel
                      except Exception: pass
                  return None,None

              to,tsel=visible_css(["input[placeholder*='받는']","input[aria-label*='받는']","input[name*='to']","textarea[placeholder*='받는']"])
              sub,ssel=visible_css(["input[placeholder*='제목']","input[aria-label*='제목']","input[name*='subject']"])
              body,bsel=visible_css(["[contenteditable='true'][role='textbox']","div[contenteditable='true']","textarea[placeholder*='내용']","textarea[aria-label*='내용']"])

              if not to:
                  inputs=[e for e in driver.find_elements(By.CSS_SELECTOR,"input[type='text'],input:not([type]),textarea") if e.is_displayed()]
                  if inputs: to,tsel=inputs[0],'fallback-first-input'
              if not sub:
                  inputs=[e for e in driver.find_elements(By.CSS_SELECTOR,"input[type='text'],input:not([type])") if e.is_displayed() and (not to or e.id!=to.id)]
                  if inputs: sub,ssel=inputs[0],'fallback-second-input'
              if not body:
                  edits=[e for e in driver.find_elements(By.CSS_SELECTOR,"[contenteditable='true'],textarea") if e.is_displayed()]
                  edits=sorted(edits,key=lambda e:e.size.get('width',0)*e.size.get('height',0),reverse=True)
                  if edits: body,bsel=edits[0],'fallback-largest-editable'
              if not body:
                  for frame in driver.find_elements(By.CSS_SELECTOR,'iframe'):
                      try:
                          driver.switch_to.frame(frame)
                          edits=[e for e in driver.find_elements(By.CSS_SELECTOR,"body[contenteditable='true'],[contenteditable='true'],textarea") if e.is_displayed()]
                          if edits: body,bsel=edits[0],'iframe-editable'; break
                          driver.switch_to.default_content()
                      except Exception:
                          driver.switch_to.default_content()
              if not to or not sub or not body:
                  raise RuntimeError(f'Compose fields not found: to={bool(to)} sub={bool(sub)} body={bool(body)}')

              to.click(); to.send_keys(cmd['to']); to.send_keys(Keys.ENTER)
              sub.click(); sub.send_keys(cmd['subject'])
              body.click(); body.send_keys(cmd['body'])
              driver.switch_to.default_content(); time.sleep(1)

              send=None
              for e in driver.find_elements(By.XPATH,"//*[self::button or self::a or @role='button']"):
                  try:
                      if not e.is_displayed(): continue
                      txt=(e.text or e.get_attribute('aria-label') or e.get_attribute('title') or '').strip()
                      if txt in ('보내기','메일 보내기'):
                          send=e; break
                  except Exception: pass
              if not send:
                  raise RuntimeError('Send button not found')
              send.click(); time.sleep(5)

              for dialog in driver.find_elements(By.CSS_SELECTOR,"[role='dialog'],.layer,.modal"):
                  try:
                      if not dialog.is_displayed(): continue
                      for e in dialog.find_elements(By.XPATH,".//*[self::button or self::a or @role='button']"):
                          txt=(e.text or e.get_attribute('aria-label') or '').strip()
                          if txt in ('확인','보내기'):
                              e.click(); time.sleep(3); break
                  except Exception: pass

              page=driver.find_element(By.TAG_NAME,'body').text
              sent=bool(re.search(r'메일을\s*보냈|발송.*완료|보내기\s*완료',page)) or ('sent' in driver.current_url.lower())
              driver.save_screenshot(str(out/'result.png'))
              result={'ok':sent,'sent':sent,'url':driver.current_url,'to_selector':tsel,'subject_selector':ssel,'body_selector':bsel,'status_excerpt':page[-700:]}
              if not sent:
                  raise RuntimeError('Send clicked but success confirmation not detected')
          except Exception as exc:
              try: driver.switch_to.default_content(); driver.save_screenshot(str(out/'result.png'))
              except Exception: pass
              result.update({'ok':False,'error':f'{type(exc).__name__}: {exc}','url':driver.current_url,'traceback':traceback.format_exc()})
              raise
          finally:
              (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              driver.quit()
          PY

      - name: Upload send result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-single-result
          path: |
            /tmp/naver-single/out/result.json
            /tmp/naver-single/out/result.png
          retention-days: 1
          if-no-files-found: warn
