name: Naver QR Mail Single Session

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/naver-single-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-venv
          python3 -m venv /tmp/naver-bridge-venv
          /tmp/naver-bridge-venv/bin/pip install --quiet selenium

      - name: Start one Chrome and capture login-only QR
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export HOME=/tmp/naver-bridge/home
          mkdir -p "$HOME" /tmp/naver-bridge/profile /tmp/naver-bridge/out
          nohup Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/naver-bridge/xvfb.log 2>&1 &
          sleep 2
          nohup "$CHROME_BINARY" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/naver-bridge/profile \
            --window-position=0,0 --window-size=1440,900 \
            'https://nid.naver.com/nidlogin.login' \
            >/tmp/naver-bridge/chrome.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          /tmp/naver-bridge-venv/bin/python - <<'PY'
          import json, os, re, time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          opt=webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          d=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          state={}
          try:
              WebDriverWait(d,30).until(lambda x:x.execute_script('return document.readyState') in ('interactive','complete'))
              time.sleep(2)
              clicked=False
              for e in d.find_elements(By.XPATH,"//*[self::a or self::button or @role='button' or @role='tab']"):
                  try:
                      txt=(e.text or e.get_attribute('aria-label') or e.get_attribute('title') or '').strip()
                      if e.is_displayed() and re.search(r'QR\s*(코드|로그인|sign-in)?',txt,re.I):
                          e.click(); clicked=True; state['clicked_text']=txt; break
                  except Exception: pass
              if not clicked:
                  d.get('https://nid.naver.com/nidlogin.login?mode=qrcode')
              time.sleep(3)
              qr=None
              for sel in ["img[id*='qr' i]","img[class*='qr' i]","[id*='qr' i] img","[class*='qr' i] img"]:
                  try:
                      xs=[e for e in d.find_elements(By.CSS_SELECTOR,sel) if e.is_displayed() and e.size.get('width',0)>=100 and e.size.get('height',0)>=100]
                      if xs: qr=xs[0]; state['qr_selector']=sel; break
                  except Exception: pass
              if qr is None: raise RuntimeError('QR image not found')
              panel=None
              for xp in ["./ancestor::form[1]","./ancestor::div[contains(@class,'qr')][1]"]:
                  try:
                      p=qr.find_element(By.XPATH,xp)
                      if p.is_displayed() and p.size.get('width',0)>=300 and p.size.get('height',0)>=180: panel=p; break
                  except Exception: pass
              (panel or qr).screenshot('/tmp/naver-bridge/out/login.png')
              state['url']=d.current_url
              state['body_excerpt']=d.find_element(By.TAG_NAME,'body').text[:1000]
              with open('/tmp/naver-bridge/out/login-state.json','w',encoding='utf-8') as f: json.dump(state,f,ensure_ascii=False,indent=2)
          finally:
              d.quit()
          PY

      - name: Upload login-only QR
        uses: actions/upload-artifact@v4
        with:
          name: naver-login-only
          path: |
            /tmp/naver-bridge/out/login.png
            /tmp/naver-bridge/out/login-state.json
          retention-days: 1
          if-no-files-found: error

      - name: Wait for approval and send from exact compose fields
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/naver-bridge-venv/bin/python - <<'PY'
          import json, os, pathlib, re, time, traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          OUT=pathlib.Path('/tmp/naver-bridge/out')
          TO='tequiero7342@gmail.com'
          SUBJECT='ChatGPT Naver Mail Bridge Test'
          BODY='ChatGPT Naver mail bridge test. This message was sent from the authenticated browser session.'

          opt=webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          d=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          result={'ok':False,'recipient':TO}

          def visible(el):
              try:
                  return el.is_displayed() and el.size.get('width',0)>3 and el.size.get('height',0)>3
              except Exception:
                  return False

          def text_of(el):
              try:
                  return (el.text or el.get_attribute('aria-label') or el.get_attribute('title') or '').strip()
              except Exception:
                  return ''

          def find_subject_input():
              selectors=[
                  "input[placeholder*='제목']","input[aria-label*='제목']",
                  "input[name*='subject' i]","input[id*='subject' i]","input[id*='title' i]"
              ]
              for sel in selectors:
                  for e in d.find_elements(By.CSS_SELECTOR,sel):
                      if visible(e): return e,sel
              ref=d.find_elements(By.ID,'reference_input_element')
              ref_y=ref[0].rect['y'] if ref and visible(ref[0]) else 220
              c=[]
              for e in d.find_elements(By.CSS_SELECTOR,"input[type='text'],input:not([type])"):
                  if not visible(e): continue
                  rid=e.get_attribute('id') or ''
                  if rid in ('recipient_input_element','reference_input_element'): continue
                  r=e.rect
                  if r['width']>400 and ref_y+15 < r['y'] < ref_y+100:
                      c.append((r['y'],e))
              return (sorted(c,key=lambda x:x[0])[0][1],'geometry-after-reference') if c else (None,None)

          try:
              deadline=time.time()+420
              while time.time()<deadline:
                  cookies={c.get('name') for c in d.get_cookies()}
                  if 'NID_AUT' in cookies or 'NID_SES' in cookies or 'nidlogin.login' not in d.current_url.lower(): break
                  time.sleep(1)
              else:
                  raise TimeoutError('QR login approval timeout')

              d.get('https://mail.naver.com')
              WebDriverWait(d,30).until(lambda x:x.execute_script('return document.readyState') in ('interactive','complete'))
              time.sleep(4)
              if 'nidlogin' in d.current_url.lower(): raise RuntimeError('Naver session not authenticated')

              compose=None
              for e in d.find_elements(By.XPATH,"//*[self::button or self::a or @role='button']"):
                  if visible(e) and re.search(r'메일\s*쓰기',text_of(e)):
                      compose=e; break
              if compose is None: raise RuntimeError('Compose button not found')
              d.execute_script('arguments[0].click()',compose)
              time.sleep(4)
              d.save_screenshot(str(OUT/'compose.png'))

              recipient=d.find_elements(By.ID,'recipient_input_element')
              recipient=recipient[0] if recipient and visible(recipient[0]) else None
              subject,subject_sel=find_subject_input()
              if recipient is None or subject is None:
                  raise RuntimeError(f'Compose inputs missing recipient={bool(recipient)} subject={bool(subject)}')

              # Force an exact recipient value through the native input setter. Do not press Enter blindly.
              d.execute_script("""
                const el=arguments[0], value=arguments[1];
                const set=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
                set.call(el,''); el.dispatchEvent(new Event('input',{bubbles:true}));
                set.call(el,value); el.dispatchEvent(new Event('input',{bubbles:true}));
                el.dispatchEvent(new Event('change',{bubbles:true})); el.focus();
              """,recipient,TO)
              time.sleep(1)

              # If Naver shows the exact address as an autocomplete candidate, select that exact candidate only.
              exact=None
              for e in d.find_elements(By.XPATH,f"//*[normalize-space(.)='{TO}']"):
                  if visible(e):
                      exact=e; break
              if exact is not None:
                  d.execute_script('arguments[0].click()',exact)
                  time.sleep(.7)
              else:
                  # Blur to commit the raw exact address without accepting an unrelated suggestion.
                  subject.click(); time.sleep(.5)

              # Re-find the subject after recipient UI updates.
              subject,subject_sel=find_subject_input()
              if subject is None: raise RuntimeError('Subject input disappeared')
              subject.clear(); subject.send_keys(SUBJECT)

              d.switch_to.default_content()
              body=None; body_sel=None
              for sel in ["[contenteditable='true'][role='textbox']","div[contenteditable='true']","textarea[placeholder*='내용']","textarea[aria-label*='내용']"]:
                  for e in d.find_elements(By.CSS_SELECTOR,sel):
                      if visible(e): body=e; body_sel=sel; break
                  if body: break
              if body is None:
                  for frame in d.find_elements(By.CSS_SELECTOR,'iframe'):
                      try:
                          d.switch_to.default_content(); d.switch_to.frame(frame)
                          for sel in ["body[contenteditable='true']","[contenteditable='true']","textarea"]:
                              xs=[e for e in d.find_elements(By.CSS_SELECTOR,sel) if visible(e)]
                              if xs:
                                  body=xs[0]; body_sel='iframe:'+sel; break
                          if body: break
                      except Exception: pass
              if body is None: raise RuntimeError('Body editor not found')
              body.click(); body.send_keys(BODY)
              d.switch_to.default_content(); time.sleep(1)
              d.save_screenshot(str(OUT/'filled.png'))

              recipient_now=d.find_elements(By.ID,'recipient_input_element')
              recipient_value=recipient_now[0].get_attribute('value') if recipient_now else ''
              page_text=d.find_element(By.TAG_NAME,'body').text
              result['recipient_value']=recipient_value
              result['subject_selector']=subject_sel
              result['body_selector']=body_sel
              result['pre_send_excerpt']=page_text[-1400:]

              # The exact target must be present either as raw input or as a committed recipient chip.
              recipient_ok=(recipient_value==TO or TO in page_text)
              if not recipient_ok:
                  raise RuntimeError(f'Exact recipient not committed: value={recipient_value!r}')
              if SUBJECT not in page_text and subject.get_attribute('value')!=SUBJECT:
                  raise RuntimeError('Subject readback failed')

              send=None
              for e in d.find_elements(By.XPATH,"//*[self::button or self::a or @role='button']"):
                  if visible(e) and text_of(e) in ('보내기','메일 보내기','Send'):
                      send=e; break
              if send is None: raise RuntimeError('Send button not found')
              d.execute_script('arguments[0].click()',send)
              time.sleep(5)

              for dialog in d.find_elements(By.CSS_SELECTOR,"[role='dialog'],.layer,.modal"):
                  if not visible(dialog): continue
                  for e in dialog.find_elements(By.XPATH,".//*[self::button or self::a or @role='button']"):
                      if visible(e) and text_of(e) in ('확인','보내기','Send'):
                          d.execute_script('arguments[0].click()',e); time.sleep(3); break

              d.switch_to.default_content()
              text=d.find_element(By.TAG_NAME,'body').text
              current=d.current_url
              sent=bool(re.search(r'메일을\s*보냈|발송.*완료|보내기\s*완료',text,re.I)) or '/write' not in current.lower() and '/new' not in current.lower()
              d.save_screenshot(str(OUT/'result.png'))
              result.update({'ok':sent,'sent':sent,'url':current,'status_excerpt':text[-1000:]})
              if not sent: raise RuntimeError('Send success not detected')

          except Exception as exc:
              try: d.switch_to.default_content(); d.save_screenshot(str(OUT/'result.png'))
              except Exception: pass
              result.update({'ok':False,'error':f'{type(exc).__name__}: {exc}','url':d.current_url,'traceback':traceback.format_exc()})
              raise
          finally:
              (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              d.quit()
          PY

      - name: Upload send result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-single-result
          path: |
            /tmp/naver-bridge/out/result.json
            /tmp/naver-bridge/out/result.png
            /tmp/naver-bridge/out/compose.png
            /tmp/naver-bridge/out/filled.png
          retention-days: 1
          if-no-files-found: warn
