name: Naver QR Mail Single Session

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/naver-single-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-venv
          python3 -m venv /tmp/naver-bridge-venv
          /tmp/naver-bridge-venv/bin/pip install --quiet selenium

      - name: Start one Chrome and capture login-only QR
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export HOME=/tmp/naver-bridge/home
          mkdir -p "$HOME" /tmp/naver-bridge/profile /tmp/naver-bridge/out
          nohup Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/naver-bridge/xvfb.log 2>&1 &
          sleep 2
          nohup "$CHROME_BINARY" \
            --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --no-first-run --no-default-browser-check \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/naver-bridge/profile \
            --window-position=0,0 --window-size=1440,900 \
            'https://nid.naver.com/nidlogin.login' \
            >/tmp/naver-bridge/chrome.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9222/json/version >/dev/null

          /tmp/naver-bridge-venv/bin/python - <<'PY'
          import json, os, re, time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          opt=webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          d=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          state={}
          try:
              WebDriverWait(d,30).until(lambda x:x.execute_script('return document.readyState') in ('interactive','complete'))
              time.sleep(2)
              clicked=False
              for e in d.find_elements(By.XPATH,"//*[self::a or self::button or @role='button' or @role='tab']"):
                  try:
                      txt=(e.text or e.get_attribute('aria-label') or e.get_attribute('title') or '').strip()
                      if e.is_displayed() and re.search(r'QR\s*(코드|로그인|sign-in)?',txt,re.I):
                          e.click(); clicked=True; state['clicked_text']=txt; break
                  except Exception: pass
              if not clicked:
                  d.get('https://nid.naver.com/nidlogin.login?mode=qrcode')
              time.sleep(3)
              qr=None
              for sel in ["img[id*='qr' i]","img[class*='qr' i]","[id*='qr' i] img","[class*='qr' i] img"]:
                  try:
                      xs=[e for e in d.find_elements(By.CSS_SELECTOR,sel) if e.is_displayed() and e.size.get('width',0)>=100 and e.size.get('height',0)>=100]
                      if xs: qr=xs[0]; state['qr_selector']=sel; break
                  except Exception: pass
              if qr is None: raise RuntimeError('QR image not found')
              panel=None
              for xp in ["./ancestor::form[1]","./ancestor::div[contains(@class,'qr')][1]"]:
                  try:
                      p=qr.find_element(By.XPATH,xp)
                      if p.is_displayed() and p.size.get('width',0)>=300 and p.size.get('height',0)>=180: panel=p; break
                  except Exception: pass
              (panel or qr).screenshot('/tmp/naver-bridge/out/login.png')
              state['url']=d.current_url
              with open('/tmp/naver-bridge/out/login-state.json','w',encoding='utf-8') as f: json.dump(state,f,ensure_ascii=False,indent=2)
          finally:
              d.quit()
          PY

      - name: Upload login-only QR
        uses: actions/upload-artifact@v4
        with:
          name: naver-login-only
          path: |
            /tmp/naver-bridge/out/login.png
            /tmp/naver-bridge/out/login-state.json
          retention-days: 1
          if-no-files-found: error

      - name: Wait for QR approval and send test mail in same Chrome
        env:
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/naver-bridge-venv/bin/python - <<'PY'
          import json, os, pathlib, re, time, traceback
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait

          OUT=pathlib.Path('/tmp/naver-bridge/out')
          TO='tequiero7342@gmail.com'
          SUBJECT='ChatGPT Naver Mail Bridge Test'
          BODY='ChatGPT가 QR 로그인 브리지를 통해 보낸 테스트 메일입니다.'

          opt=webdriver.ChromeOptions(); opt.debugger_address='127.0.0.1:9222'
          d=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          result={'ok':False,'recipient':TO}

          def displayed_xpath(xp):
              for e in d.find_elements(By.XPATH,xp):
                  try:
                      if e.is_displayed(): return e
                  except Exception: pass
              return None

          def displayed_css(selectors):
              for sel in selectors:
                  try:
                      for e in d.find_elements(By.CSS_SELECTOR,sel):
                          if e.is_displayed() and e.size.get('width',0)>3 and e.size.get('height',0)>3:
                              return e,sel
                  except Exception: pass
              return None,None

          try:
              deadline=time.time()+420
              while time.time()<deadline:
                  cookies={c.get('name') for c in d.get_cookies()}
                  if 'NID_AUT' in cookies or 'NID_SES' in cookies or 'nidlogin.login' not in d.current_url.lower(): break
                  time.sleep(1)
              else:
                  raise TimeoutError('QR login approval timeout')

              d.get('https://mail.naver.com')
              WebDriverWait(d,30).until(lambda x:x.execute_script('return document.readyState') in ('interactive','complete'))
              time.sleep(5)
              if 'nidlogin' in d.current_url.lower(): raise RuntimeError('Naver session not authenticated')

              compose=displayed_xpath("//*[self::button or self::a or @role='button'][contains(normalize-space(.),'메일 쓰기') or contains(@aria-label,'메일 쓰기') or contains(@title,'메일 쓰기')]")
              if compose is None:
                  compose=displayed_xpath("//*[self::button or self::a or @role='button'][contains(normalize-space(.),'메일쓰기') or contains(@aria-label,'메일쓰기') or contains(@title,'메일쓰기')]")
              if compose is None: raise RuntimeError('메일 쓰기 button not found')
              d.execute_script('arguments[0].click()',compose)
              time.sleep(4)
              d.save_screenshot(str(OUT/'compose.png'))

              def find_to():
                  e,sel=displayed_css(["input[placeholder*='받는']","input[aria-label*='받는']","input[name*='to' i]","input[id*='to' i]"])
                  if e: return e,sel
                  e=displayed_xpath("//*[contains(normalize-space(.),'받는 사람') or contains(normalize-space(.),'받는사람')]/following::input[1]")
                  return (e,'xpath-near-recipient-label') if e else (None,None)

              def find_subject():
                  e,sel=displayed_css(["input[placeholder*='제목']","input[aria-label*='제목']","input[name*='subject' i]","input[id*='subject' i]"])
                  if e: return e,sel
                  e=displayed_xpath("//*[normalize-space(.)='제목']/following::input[1]")
                  return (e,'xpath-near-subject-label') if e else (None,None)

              to,tsel=find_to(); subject,ssel=find_subject()
              if not to or not subject:
                  raise RuntimeError(f'Compose header fields not found: to={bool(to)} subject={bool(subject)}')

              to.click(); to.send_keys(TO); to.send_keys(Keys.ENTER)
              time.sleep(.5)
              subject,ssel=find_subject()
              if not subject: raise RuntimeError('Subject disappeared after recipient entry')
              subject.click(); subject.send_keys(SUBJECT)

              d.switch_to.default_content()
              body,bsel=displayed_css(["[contenteditable='true'][role='textbox']","div[contenteditable='true']","textarea[placeholder*='내용']","textarea[aria-label*='내용']"])
              if not body:
                  for frame in d.find_elements(By.CSS_SELECTOR,'iframe'):
                      try:
                          d.switch_to.default_content(); d.switch_to.frame(frame)
                          body,bsel=displayed_css(["body[contenteditable='true']","[contenteditable='true']","textarea"])
                          if body:
                              bsel='iframe:'+str(bsel); break
                      except Exception: pass
              if not body: raise RuntimeError('Body editor not found')
              body.click(); body.send_keys(BODY)
              d.switch_to.default_content(); time.sleep(1)

              send=displayed_xpath("//*[self::button or self::a or @role='button'][normalize-space(.)='보내기' or @aria-label='보내기' or @title='보내기']")
              if send is None: raise RuntimeError('Send button not found')
              d.execute_script('arguments[0].click()',send)
              time.sleep(5)

              for dialog in d.find_elements(By.CSS_SELECTOR,"[role='dialog'],.layer,.modal"):
                  try:
                      if not dialog.is_displayed(): continue
                      btn=None
                      for e in dialog.find_elements(By.XPATH,".//*[self::button or self::a or @role='button']"):
                          txt=(e.text or e.get_attribute('aria-label') or '').strip()
                          if txt in ('확인','보내기'): btn=e; break
                      if btn: d.execute_script('arguments[0].click()',btn); time.sleep(3)
                  except Exception: pass

              d.switch_to.default_content()
              text=d.find_element(By.TAG_NAME,'body').text
              compose_left=displayed_xpath("//*[self::button or self::a or @role='button'][normalize-space(.)='보내기' or @aria-label='보내기' or @title='보내기']") is not None
              sent=bool(re.search(r'메일을\s*보냈|발송.*완료|보내기\s*완료',text,re.I)) or not compose_left
              d.save_screenshot(str(OUT/'result.png'))
              result={'ok':sent,'sent':sent,'url':d.current_url,'to_selector':tsel,'subject_selector':ssel,'body_selector':bsel,'status_excerpt':text[-700:]}
              if not sent: raise RuntimeError('Send success not detected')
          except Exception as exc:
              try: d.switch_to.default_content(); d.save_screenshot(str(OUT/'result.png'))
              except Exception: pass
              result.update({'ok':False,'error':f'{type(exc).__name__}: {exc}','url':d.current_url,'traceback':traceback.format_exc()})
              raise
          finally:
              (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
              d.quit()
          PY

      - name: Upload send result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-single-result
          path: |
            /tmp/naver-bridge/out/result.json
            /tmp/naver-bridge/out/result.png
            /tmp/naver-bridge/out/compose.png
          retention-days: 1
          if-no-files-found: warn
