name: Carrier Web Research v6

on:
  push:
    branches: [carrier-web-v6-20260830]
    paths:
      - '.carrier-web-v6/requests/*.json'

permissions:
  contents: write

concurrency:
  group: carrier-web-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-compress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carrier-web-v6-20260830
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal runtime
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Resolve request from triggering commit
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^\.carrier-web-v6/requests/.*\.json$' | tail -1)"
          test -n "$FILE"
          RID="$(python -c 'import json,sys,pathlib; p=sys.argv[1]; print(json.load(open(p)).get("request_id") or pathlib.Path(p).stem)' "$FILE")"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "rid=$RID" >> "$GITHUB_OUTPUT"

      - name: Run 5-Interceptor web collector + compressor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/carrier-web-v6/raw .carrier-web-v6/results
          python .carrier-web-v6/collector.py \
            --request "${{ steps.req.outputs.file }}" \
            --out ".carrier-web-v6/results/${{ steps.req.outputs.rid }}.json" \
            --raw-dir /tmp/carrier-web-v6/raw

      - name: Upload raw snapshot for short-lived audit only
        uses: actions/upload-artifact@v4
        with:
          name: carrier-web-v6-raw-${{ steps.req.outputs.rid }}
          path: /tmp/carrier-web-v6/raw
          retention-days: 1
          if-no-files-found: ignore

      - name: Commit compact result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'carrier-web-v6[bot]'
          git config user.email 'carrier-web-v6[bot]@users.noreply.github.com'
          git add ".carrier-web-v6/results/${{ steps.req.outputs.rid }}.json"
          git diff --cached --quiet && exit 0
          git commit -m "carrier web v6 result: ${{ steps.req.outputs.rid }}"
          git push origin HEAD:carrier-web-v6-20260830
