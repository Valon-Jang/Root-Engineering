name: Apply Rebirth Explicit Compact Policy v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-rebirth-explicit-compact-policy-v2.yml

permissions:
  contents: write

concurrency:
  group: rebirth-explicit-compact-policy-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize migration from verified payload
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/apply-rebirth-explicit-compact-policy.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s+MIGRATE_GZ_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if not match:
              raise SystemExit('embedded migration payload not found')
          payload = gzip.decompress(base64.b64decode(match.group(1)))
          target = Path('tools/migrate_rebirth_policy_min.py')
          target.write_bytes(payload)
          PY

      - name: Apply explicit-compact-only policy
        run: python tools/migrate_rebirth_policy_min.py

      - name: Validate Rebirth package
        run: |
          sudo mkdir -p /mnt/data
          sudo chown "$(id -u):$(id -g)" /mnt/data
          python tools/validate_rebirth_installer.py
          python tools/validate_rebirth_backup_policy.py
          python tools/validate_rebirth_md_fusion.py
          python tools/rebirth_local_selftest.py
          python tools/validate_rebirth_runtime.py
          git diff --check

      - name: Commit policy update
        run: |
          rm -f tools/migrate_rebirth_policy_min.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md installer docs tools
          if git diff --cached --quiet; then
            echo 'No policy changes to commit.'
            exit 0
          fi
          git commit -m 'Make Rebirth backup sync explicit-compact-only'
          git push origin HEAD:main
