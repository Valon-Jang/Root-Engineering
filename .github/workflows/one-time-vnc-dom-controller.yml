name: One-time VNC DOM Controller

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/one-time-vnc-dom-controller.yml
      - .bridge/controller-dom-start.txt

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install dependencies
        run: python -m pip install --quiet selenium cryptography requests

      - name: Generate one-time key
        run: |
          mkdir -p /tmp/dom-controller
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/dom-controller/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/dom-controller/private.pem -pubout -out /tmp/dom-controller/public.pem >/dev/null 2>&1

      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: dom-controller-public-key
          path: /tmp/dom-controller/public.pem
          retention-days: 1

      - name: Wait for encrypted request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,time,requests
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          out=pathlib.Path('/tmp/dom-controller')
          request_id=pathlib.Path('.bridge/controller-dom-start.txt').read_text().strip()
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/contents/.bridge/controller-dom-request.enc"
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          private=serialization.load_pem_private_key((out/'private.pem').read_bytes(),password=None)
          def dec(raw):
              env=json.loads(raw.decode())
              k=private.decrypt(base64.b64decode(env['wrapped_key']),padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
              return json.loads(AESGCM(k).decrypt(base64.b64decode(env['nonce']),base64.b64decode(env['ciphertext']),None).decode())
          deadline=time.time()+180
          while time.time()<deadline:
              r=requests.get(url,headers=headers,params={'ref':os.environ['HEAD_REF']},timeout=20)
              if r.status_code==200:
                  raw=base64.b64decode(r.json()['content'])
                  if raw.strip()!=b'PENDING':
                      try:
                          cmd=dec(raw)
                          if cmd.get('request_id')==request_id:
                              (out/'command.json').write_text(json.dumps(cmd),encoding='utf-8')
                              break
                      except Exception:
                          pass
              time.sleep(2)
          else:
              raise TimeoutError('No matching encrypted request')
          PY

      - name: Control noVNC DOM and remote screen
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          python - <<'PY'
          import json,os,pathlib,time,traceback
          from selenium import webdriver
          from selenium.webdriver import ActionChains
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.support.ui import WebDriverWait
          out=pathlib.Path('/tmp/dom-controller'); cmd=json.loads((out/'command.json').read_text())
          result=out/'result.json'; screen=out/'screen.png'
          opt=webdriver.ChromeOptions(); opt.binary_location=os.environ['CHROME_BINARY']
          opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=1600,1000')
          driver=webdriver.Chrome(service=Service(os.environ['CHROMEDRIVER']),options=opt)
          KEY={'ENTER':Keys.ENTER,'TAB':Keys.TAB,'ESC':Keys.ESCAPE,'CTRL':Keys.CONTROL,'SHIFT':Keys.SHIFT,'ALT':Keys.ALT,'BACKSPACE':Keys.BACKSPACE}
          try:
              driver.get(cmd['live_url'])
              def visible_password(d):
                  xs=[e for e in d.find_elements(By.CSS_SELECTOR,"input[type='password']") if e.is_displayed()]
                  return xs[0] if xs else False
              pw=WebDriverWait(driver,30).until(visible_password)
              pw.clear(); pw.send_keys(cmd['vnc_password'])
              buttons=[e for e in driver.find_elements(By.CSS_SELECTOR,"button,input[type='button'],input[type='submit']") if e.is_displayed()]
              target=None
              for b in buttons:
                  txt=(b.text or b.get_attribute('value') or b.get_attribute('aria-label') or '').strip().lower()
                  if 'send credentials' in txt or 'credential' in txt or 'connect' in txt:
                      target=b; break
              if target is None: raise RuntimeError('Send Credentials button not found')
              driver.execute_script('arguments[0].click()',target)
              WebDriverWait(driver,30).until(lambda d: not any(e.is_displayed() for e in d.find_elements(By.CSS_SELECTOR,"input[type='password']")))
              canvas=WebDriverWait(driver,30).until(lambda d: d.find_element(By.ID,'noVNC_canvas'))
              time.sleep(3)
              def hotkey(keys):
                  vals=[KEY.get(str(k).upper(),k) for k in keys]
                  ch=ActionChains(driver).move_to_element(canvas).click()
                  for k in vals[:-1]: ch.key_down(k)
                  ch.send_keys(vals[-1])
                  for k in reversed(vals[:-1]): ch.key_up(k)
                  ch.perform()
              for a in cmd.get('actions',[{'type':'screenshot'}]):
                  t=a['type']
                  if t=='wait': time.sleep(float(a.get('seconds',1)))
                  elif t=='click': ActionChains(driver).move_to_element_with_offset(canvas,int(a['x']),int(a['y'])).click().perform()
                  elif t=='double_click': ActionChains(driver).move_to_element_with_offset(canvas,int(a['x']),int(a['y'])).double_click().perform()
                  elif t=='text': ActionChains(driver).move_to_element(canvas).click().send_keys(a['value']).perform()
                  elif t=='key': ActionChains(driver).move_to_element(canvas).click().send_keys(KEY.get(str(a['value']).upper(),a['value'])).perform()
                  elif t=='hotkey': hotkey(a['keys'])
                  elif t=='screenshot': driver.save_screenshot(str(screen))
                  else: raise ValueError(t)
                  time.sleep(float(a.get('after',.5)))
              driver.save_screenshot(str(screen))
              result.write_text(json.dumps({'ok':True,'request_id':cmd['request_id'],'canvas_size':canvas.size},indent=2))
          except Exception as e:
              try: driver.save_screenshot(str(screen))
              except Exception: pass
              result.write_text(json.dumps({'ok':False,'request_id':cmd.get('request_id'),'error':f'{type(e).__name__}: {e}','traceback':traceback.format_exc()},indent=2))
              raise
          finally:
              driver.quit()
          PY

      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-controller-response
          path: |
            /tmp/dom-controller/result.json
            /tmp/dom-controller/screen.png
          retention-days: 1
          if-no-files-found: warn
