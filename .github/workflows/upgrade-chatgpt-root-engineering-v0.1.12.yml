name: One-shot ChatGPT Root Engineering v0.1.12 upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-chatgpt-root-engineering-v0.1.12.yml
      - tools/upgrade_chatgpt_root_engineering_v0_1_12.py

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch installers and README
        run: python tools/upgrade_chatgpt_root_engineering_v0_1_12.py
      - name: Validate and publish
        shell: bash
        run: |
          rm -f .github/workflows/upgrade-chatgpt-root-engineering-v0.1.12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Upgrade ChatGPT Root Engineering to v0.1.12"
          git push
