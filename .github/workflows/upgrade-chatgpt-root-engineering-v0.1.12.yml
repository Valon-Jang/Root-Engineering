name: One-shot ChatGPT Root Engineering v0.1.12 upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-chatgpt-root-engineering-v0.1.12.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ChatGPT installers and README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          EN = Path('installer/ROOT_ENGINEERING_INSTALLER.md')
          KO = Path('installer/ROOT_ENGINEERING_INSTALLER_KO.md')
          README = Path('README.md')

          def rep1(s, old, new, label):
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return s.replace(old, new, 1)

          def insert_before(s, marker, payload, label):
              if payload.strip() in s:
                  return s
              return rep1(s, marker, payload + '\n\n' + marker, label)

          def replace_section(s, start, end, new_body, label):
              a = s.find(start)
              b = s.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0:
                  raise RuntimeError(f'{label}: section boundary missing')
              return s[:a] + new_body.rstrip() + '\n\n---\n\n' + s[b:]

