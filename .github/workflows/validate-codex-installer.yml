name: Validate Codex installer

on:
  workflow_dispatch:
  push:
    paths:
      - "installer/codex/**"
      - "installer/ROOT_ENGINEERING_CODEX_INSTALLER*.md"
      - ".github/workflows/validate-codex-installer.yml"
  pull_request:
    paths:
      - "installer/codex/**"
      - "installer/ROOT_ENGINEERING_CODEX_INSTALLER*.md"
      - ".github/workflows/validate-codex-installer.yml"

permissions:
  contents: read

jobs:
  self-test:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package and non-destructive initialization
        run: pwsh -NoProfile -File ./installer/codex/root-engineering/scripts/root_engineering.ps1 self-test -Json
