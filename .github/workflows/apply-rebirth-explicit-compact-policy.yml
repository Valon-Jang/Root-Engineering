name: Apply Rebirth Explicit Compact Policy

on:
  push:
    branches:
      - main
    paths:
      - tools/migrate_rebirth_policy_min.py

permissions:
  contents: write

concurrency:
  group: rebirth-explicit-compact-policy
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply explicit-compact-only policy
        run: python tools/migrate_rebirth_policy_min.py

      - name: Validate Rebirth package
        run: |
          python tools/validate_rebirth_installer.py
          python tools/validate_rebirth_backup_policy.py
          python tools/validate_rebirth_md_fusion.py
          python tools/rebirth_local_selftest.py
          python tools/validate_rebirth_runtime.py
          git diff --check

      - name: Commit policy update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md installer docs tools
          if git diff --cached --quiet; then
            echo 'No policy changes to commit.'
            exit 0
          fi
          git commit -m 'Make Rebirth backup sync explicit-compact-only'
          git push origin HEAD:main
